openapi: 3.0.3
info:
  title: Money Anywhere API (draft)
  version: 0.16.0
  description: |
    Contract shared by the three team members. Draft for R&D; not yet approved in AI-DLC design.
    Conventions (see docs/design/api-review.md):
    - Resources are plural nouns, organised by domain, never by screen. Screens reach endpoints
      through the action catalog in app-config, so moving a menu or button never changes this contract.
    - State changes that are not plain field edits are recorded as events (POST .../events), not verb paths.
    - Every request from the app carries X-Device-Id (no login in the Demo). Integration endpoints use X-Api-Key.
    - Writes that store personal data need the matching consent purpose (core, ai, gov). Otherwise 403 CONSENT_REQUIRED.
    - Every response carries X-Request-Id. Errors always use the Error object.
    - Lists use limit + cursor. Writes that a double tap could repeat accept Idempotency-Key.
    - Money amounts never come from AI. They come from published rates, user input, or a government adapter.
    - All amounts are THB. All user-facing text is Thai.
servers:
  - url: http://localhost:8080
    description: Local mock server (contracts/mock-server.js)

tags:
  - { name: System, description: "สถานะ server และหลักฐาน commit" }
  - { name: Config, description: "โครงแอปและรายการตัวเลือก" }
  - { name: Privacy, description: "ประกาศความเป็นส่วนตัวและความยินยอม (PDPA)" }
  - { name: Me, description: "โปรไฟล์ ข้อมูลสถานการณ์ การตั้งค่า สิ่งที่ AI จำ ส่งออกและลบข้อมูล" }
  - { name: Gov, description: "โหมดเชื่อมรัฐ (ThaID) ซ่อนหลัง feature flag" }
  - { name: Intake, description: "สร้างโปรไฟล์ด้วยการคุยถามทีละข้อ" }
  - { name: Money, description: "เงินอยู่ไหน ได้เท่าไหร่ และเส้นทางรับเงิน" }
  - { name: Opportunity, description: "ค้นหา รายละเอียด และรายงานโอกาส" }
  - { name: AI, description: "AI จัดอันดับ อธิบาย และผู้ช่วยที่ใช้เครื่องมือ มี fallback" }
  - { name: Planner, description: "แผนรายได้และไอเดียจากทักษะ คำนวณตรง" }
  - { name: Tasks, description: "แผนของฉัน ความคืบหน้าและผลลัพธ์เป็น event" }
  - { name: Sources, description: "แหล่งข้อมูลและการดึงข้อมูล" }
  - { name: Integrations, description: "ช่องทางให้ระบบภายนอกส่งข้อมูลเข้า" }
  - { name: Demo, description: "ผู้ใช้ตัวอย่างสำหรับสาธิต ปิดได้ด้วย DEMO_MODE=0" }

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [System]
      summary: "สถานะ server เวอร์ชัน commit และผู้ให้บริการ AI (หลักฐาน AC-05)"
      responses:
        '200': { description: Health, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }

  /v1/app-config:
    get:
      operationId: getAppConfig
      tags: [Config]
      summary: "โหลดโครงเมนู หน้าจอ ปุ่ม ตัวกรอง feature flag และฉบับประกาศความเป็นส่วนตัว"
      parameters:
        - { name: appVersion, in: query, required: true, schema: { type: string } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200': { description: Current config, content: { application/json: { schema: { $ref: '#/components/schemas/AppConfig' } } } }
        '304': { description: "Unchanged, keep cached config" }

  /v1/taxonomies:
    get:
      operationId: getTaxonomies
      tags: [Config]
      summary: "หมวด กลุ่มแผนที่ กลุ่มทักษะ เขต และคำถามข้อมูลสถานการณ์"
      responses:
        '200': { description: Taxonomies, content: { application/json: { schema: { $ref: '#/components/schemas/Taxonomies' } } } }

  /v1/privacy/notice:
    get:
      operationId: getPrivacyNotice
      tags: [Privacy]
      summary: "ประกาศความเป็นส่วนตัวฉบับปัจจุบันและวัตถุประสงค์ที่ขอความยินยอม"
      responses:
        '200': { description: Notice, content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyNotice' } } } }

  /v1/me/consents:
    get:
      operationId: getConsents
      tags: [Privacy]
      summary: "ความยินยอมปัจจุบัน ต้องขอใหม่ไหม และประวัติทั้งหมด"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Consent state, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentState' } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createConsent
      tags: [Privacy]
      summary: "ให้หรือถอนความยินยอมรายวัตถุประสงค์ มีผลทันที (ถอน ai ลบสิ่งที่ AI จำ, ถอน gov ยกเลิกการเชื่อมรัฐ)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentRequest' } } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/me:
    delete:
      operationId: deleteMe
      tags: [Me]
      summary: "ลบข้อมูลทั้งหมดของเครื่องนี้ และถอนความยินยอมทั้งหมด"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Error' }

  /v1/me/profile:
    get:
      operationId: getProfile
      tags: [Me]
      summary: "ดูโปรไฟล์ของฉัน"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: putProfile
      tags: [Me]
      summary: "บันทึกโปรไฟล์ทั้งชุด ถ้าส่งเขตมาไม่มีพิกัด server หาพิกัดให้ (ต้องยินยอม core)"
      description: "ระหว่างเชื่อม ThaID ค่าโปรไฟล์ส่วนตัวและพิกัดเดิมจะคงอยู่ การบันทึกงานและรายได้ไม่เปลี่ยนข้อมูลจาก ThaID"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/me/facts:
    get:
      operationId: getFacts
      tags: [Me]
      summary: "ข้อมูลสถานการณ์ที่ใช้ตรวจสิทธิ์ (อายุ สถานะงาน ฯลฯ)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Facts, content: { application/json: { schema: { $ref: '#/components/schemas/Facts' } } } }
        '400': { $ref: '#/components/responses/Error' }
    patch:
      operationId: patchFacts
      tags: [Me]
      summary: "ตอบคำถามสถานการณ์ทีละข้อ ส่ง null เพื่อลบคำตอบ (ต้องยินยอม core)"
      description: "ระหว่างเชื่อม ThaID การเขียนผ่านเส้นทางนี้คงช่วงอายุที่เคยกรอกและข้อมูลตามทะเบียนเดิม"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Facts' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Facts' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/me/settings:
    get:
      operationId: getSettings
      tags: [Me]
      summary: "ดูการตั้งค่าการแสดงผล"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '400': { $ref: '#/components/responses/Error' }
    patch:
      operationId: patchSettings
      tags: [Me]
      summary: "แก้การตั้งค่าการแสดงผล (การแจ้งเตือนอยู่ที่ความยินยอม reminders)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/me/memory:
    get:
      operationId: listMemory
      tags: [Me]
      summary: "สิ่งที่ AI จำเกี่ยวกับฉัน (ดูได้ ลบได้)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Memory, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryList' } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: addMemory
      tags: [Me]
      summary: "ผู้ใช้เพิ่มเรื่องที่อยากให้ AI รู้เอง"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 200 } } } } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryItem' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/me/memory/{id}:
    delete:
      operationId: deleteMemory
      tags: [Me]
      summary: "ลบสิ่งที่ AI จำหนึ่งรายการ"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/me/export:
    get:
      operationId: exportMe
      tags: [Me]
      summary: "ส่งออกข้อมูลทั้งหมดที่แอปเก็บ สำหรับหน้า ข้อมูลของฉัน"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Export, content: { application/json: { schema: { $ref: '#/components/schemas/MyData' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/me/gov-link:
    get:
      operationId: getGovLink
      tags: [Gov]
      summary: "สถานะการเชื่อม ThaID (404 เมื่อโหมดนี้ปิด)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/GovLink' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: startGovLink
      tags: [Gov]
      summary: "เริ่มเชื่อม ThaID ได้ authUrl ไปยืนยันตัวตน (ต้องยินยอม gov)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '201': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/GovLink' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteGovLink
      tags: [Gov]
      summary: "ยกเลิกการเชื่อมและลบข้อมูลจากหน่วยงาน"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/me/gov-link/callback:
    post:
      operationId: finishGovLink
      tags: [Gov]
      summary: "รับผลยืนยันตัวตนกลับจาก ThaID"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [state, code], properties: { state: { type: string }, code: { type: string } } } } } }
      responses:
        '200': { description: Connected, content: { application/json: { schema: { $ref: '#/components/schemas/GovLink' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/intake/sessions:
    post:
      operationId: createIntakeSession
      tags: [Intake]
      summary: "เริ่มการคุย ได้คำถามแรก (ต้องยินยอม core)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '201': { description: Session with first question, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeTurn' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/intake/sessions/{id}/messages:
    post:
      operationId: postIntakeMessage
      tags: [Intake]
      summary: "ตอบหนึ่งข้อ ได้คำถามถัดไปและโปรไฟล์ร่าง (AI ช่วยแปลงคำตอบถ้ายินยอม)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } } }
      responses:
        '200': { description: Next turn, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeTurn' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/money:
    get:
      operationId: getMoneyOverview
      tags: [Money]
      summary: "เงินที่ฉันอาจได้ ยอดรวม และสถานะแต่ละรายการ"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/MoneyOverview' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/money/preview:
    post:
      operationId: previewMoney
      tags: [Money]
      summary: "เช็คเงินจากคำตอบโดยไม่บันทึกอะไร ใช้ก่อนผู้ใช้กดยินยอม (ไม่ต้องมี X-Device-Id)"
      description: "Nothing is stored. nextQuestion is the next fact to ask, in program order."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [facts], properties: { facts: { type: object, additionalProperties: true } } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/MoneyPreview' } } } }
        '422': { $ref: '#/components/responses/Error' }

  /v1/money/{id}:
    get:
      operationId: getMoneyRoute
      tags: [Money]
      summary: "เส้นทางรับเงิน: อยู่ที่ไหน ได้เท่าไหร่ มีสิทธิ์ไหม เอกสาร ยื่นที่ไหน หลังยื่น"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Route, content: { application/json: { schema: { $ref: '#/components/schemas/MoneyRoute' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: patchMoneyRoute
      tags: [Money]
      summary: "ติ๊กเอกสารที่เตรียมแล้ว (ต้องยินยอม core)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [documentsReady], properties: { documentsReady: { type: array, items: { type: integer } } } } } } }
      responses:
        '200': { description: Updated route, content: { application/json: { schema: { $ref: '#/components/schemas/MoneyRoute' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/opportunities:
    get:
      operationId: searchOpportunities
      tags: [Opportunity]
      summary: "ค้นหาโอกาสตามหมวด คำค้น ระยะทาง และการเรียง (ไม่ต้องยินยอมก็ดูได้)"
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: q, in: query, schema: { type: string } }
        - { name: group, in: query, schema: { type: string, description: "map group id or all" } }
        - { name: dataMode, in: query, schema: { type: string, enum: [all, real, mock], default: all }, description: "real includes live, curated and open_data" }
        - { name: category, in: query, schema: { type: string, description: "one of the 10 categories" } }
        - { name: province, in: query, schema: { type: string }, description: "Matches a provider-supplied province." }
        - { name: district, in: query, schema: { type: string }, description: "Matches a provider-supplied district." }
        - { name: districtCode, in: query, schema: { type: string }, description: "Matches a location district code. Supply district for legacy locations that only have a name." }
        - { name: area, in: query, schema: { type: string, enum: [bangkok] }, description: "Bangkok catalogue scope. Includes listings without a province and uses the catalogue area instead of the profile radius." }
        - { name: skill, in: query, schema: { type: string }, description: "Matches a skill from the posting." }
        - { name: workMode, in: query, schema: { type: string, enum: [onsite, hybrid, remote] } }
        - { name: lat, in: query, schema: { type: number, description: "Search point. Defaults to the profile location." } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: radiusKm, in: query, schema: { type: number, default: 5 } }
        - { name: sort, in: query, schema: { type: string, enum: [near, money, fresh], default: near } }
        - { name: onlyMoney, in: query, schema: { type: boolean, default: false } }
        - { name: showSuspicious, in: query, schema: { type: boolean, default: false } }
        - { name: includeDistrictPins, in: query, schema: { type: boolean, default: false }, description: "Includes approximate map markers for Bangkok demo districts across all matching pages." }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Results, content: { application/json: { schema: { $ref: '#/components/schemas/OpportunityPage' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [Opportunity]
      summary: "ดูรายละเอียดโอกาสหนึ่งรายการ"
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: includeClosed, in: query, schema: { type: boolean, default: false }, description: "Return a closed SQLite posting for a saved plan. Pending and rejected postings stay hidden." }
      responses:
        '200': { description: Opportunity, content: { application/json: { schema: { $ref: '#/components/schemas/Opportunity' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /v1/opportunities/{id}/reports:
    post:
      operationId: reportOpportunity
      tags: [Opportunity]
      summary: "รายงานประกาศน่าสงสัย"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, enum: [suspicious, wrong_info, expired, other] }, note: { type: string } } } } } }
      responses:
        '202': { description: Accepted for review }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/ai/rankings:
    post:
      operationId: createRanking
      tags: [AI]
      summary: "ให้ AI จัดอันดับและให้เหตุผล จากรายการที่ส่งมาเท่านั้น (ไม่ยินยอมใช้กฎแทน)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RankingRequest' } } } }
      responses:
        '200': { description: Ranked, content: { application/json: { schema: { $ref: '#/components/schemas/RankingResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/ai/explanations:
    post:
      operationId: createExplanation
      tags: [AI]
      summary: "อธิบายขั้นตอนของงาน เงื่อนไขของโอกาส หรือรายการเงิน เป็นภาษาง่าย"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExplanationRequest' } } } }
      responses:
        '200': { description: Explanation, content: { application/json: { schema: { $ref: '#/components/schemas/Explanation' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/ai/conversations:
    post:
      operationId: createConversation
      tags: [AI]
      summary: "เริ่มคุยกับผู้ช่วย AI ที่รู้ข้อมูลของฉัน (ต้องยินยอม ai)"
      description: "Guided mode begins with an intent choice. Quick replies refer to the displayed step, when present. Every message passes the Guard before any AI call."
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { mode: { type: string, enum: [guided, free], default: guided } } } } }
      responses:
        '201': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /v1/ai/conversations/{id}/messages:
    post:
      operationId: postConversationMessage
      tags: [AI]
      summary: "ถามผู้ช่วย ได้คำตอบ เครื่องมือที่ใช้ งานที่รอผู้ใช้ยืนยัน และสิ่งที่จำไว้"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 1000 }, stepId: { type: string, description: "Identifier of the step that displayed this quick reply" } } } } } }
      responses:
        '200': { description: Agent turn, content: { application/json: { schema: { $ref: '#/components/schemas/AgentTurn' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/ai/conversations/{id}/actions/{actionId}:
    post:
      operationId: decideConversationAction
      tags: [AI]
      summary: "ผู้ใช้ยืนยันหรือปฏิเสธสิ่งที่ผู้ช่วยเสนอให้ทำ"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' }, { name: actionId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [confirm, reject] } } } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/ActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/plans/options:
    get:
      operationId: getPlanOptions
      tags: [Planner]
      summary: "ทางเลือกรายได้ คิดจากค่าจ้างในประกาศและเวลาว่างของฉัน (คำนวณตรง ไม่ใช้ AI)"
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: opportunityIds, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
      responses:
        '200': { description: Options, content: { application/json: { schema: { $ref: '#/components/schemas/PlanOptionList' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/plans/ideas:
    get:
      operationId: getPlanIdeas
      tags: [Planner]
      summary: "ไอเดียรายได้จากทักษะของฉัน AI เลือกและเรียงจากรายการที่ทีมคัดไว้ ตัวเลขเป็นค่าประมาณจากรายการ"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200': { description: Ideas, content: { application/json: { schema: { $ref: '#/components/schemas/IdeaList' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /v1/plans/goal:
    get:
      operationId: getIncomeGoalPlan
      tags: [Planner]
      summary: "0.9: วางแผนให้ได้รายได้ต่อเดือนตามเป้า (เงินสวัสดิการที่น่าจะได้ + งาน + ทักษะ) เป็นช่วงตัวเลข ไม่ใช่การรับประกัน"
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - { name: target, in: query, required: false, description: "บาทต่อเดือน ถ้าไม่ส่ง ใช้ incomeGoalPerMonth ในโปรไฟล์", schema: { type: integer, minimum: 1, maximum: 1000000 } }
      responses:
        '200': { description: Plan, content: { application/json: { schema: { $ref: '#/components/schemas/IncomeGoalPlan' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: "รายการงานในแผนของฉัน"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } } ]
      responses:
        '200': { description: Tasks, content: { application/json: { schema: { $ref: '#/components/schemas/TaskList' } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTask
      tags: [Tasks]
      summary: "บันทึกโอกาส หรือเริ่มรับเงินรายการหนึ่ง เข้าแผนของฉัน (ซ้ำได้ ไม่สร้างใหม่)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCreate' } } } }
      responses:
        '201': { description: Created or existing, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/tasks/{id}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: "ดูงานหนึ่งรายการและขั้นตอน"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTask
      tags: [Tasks]
      summary: "เอางานออกจากแผนของฉัน"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/tasks/{id}/events:
    get:
      operationId: listTaskEvents
      tags: [Tasks]
      summary: "ประวัติการกดของงานนี้ (หลักฐานความคืบหน้า)"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Events, content: { application/json: { schema: { $ref: '#/components/schemas/TaskEventList' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTaskEvent
      tags: [Tasks]
      summary: "บันทึกการกระทำกับงาน: ทำขั้นเสร็จ เลิกทำ ติดปัญหา เลื่อน กลับมาทำต่อ แจ้งผลลัพธ์"
      parameters: [ { $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskEventRequest' } } } }
      responses:
        '201': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/sources:
    get:
      operationId: listSources
      tags: [Sources]
      summary: "สถานะของแหล่งข้อมูลแต่ละเจ้า"
      responses:
        '200': { description: Sources, content: { application/json: { schema: { $ref: '#/components/schemas/SourceList' } } } }

  /v1/sources/{provider}/refresh:
    post:
      operationId: refreshSource
      tags: [Sources]
      summary: "สั่งดึงข้อมูลใหม่จากแหล่ง (provider = all ได้)"
      parameters: [ { name: provider, in: path, required: true, schema: { type: string } } ]
      responses:
        '202': { description: Refresh started }
        '404': { $ref: '#/components/responses/Error' }

  /v1/integrations/opportunities/batch:
    post:
      operationId: upsertOpportunitiesBatch
      tags: [Integrations]
      summary: "ระบบภายนอกหรือทีม curate ส่งโอกาสเข้าเป็นชุด ในรูปแบบฟิลด์กลาง"
      description: "With SQLite enabled, job batches require a registered push source. Send partial batches freely. Omitting an existing posting leaves it unchanged."
      parameters: [ { $ref: '#/components/parameters/ApiKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OpportunityBatch' } } } }
      responses:
        '200': { description: Result per item, content: { application/json: { schema: { $ref: '#/components/schemas/BatchResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/integrations/webhooks/{provider}:
    post:
      operationId: receiveWebhook
      tags: [Integrations]
      summary: "รับแจ้งเหตุจากผู้ให้ข้อมูล เช่น ประกาศปิดรับ หรืออัปเดต"
      parameters: [ { $ref: '#/components/parameters/ApiKey' }, { name: provider, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEvent' } } } }
      responses:
        '202': { description: Accepted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/demo/personas/{id}:
    get:
      operationId: previewDemoProfile
      tags: [Demo]
      summary: "แสดงโปรไฟล์และแหล่งข้อมูลจำลองโดยไม่โหลดทับข้อมูลของเครื่อง"
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/DemoPrefillSources' } ]
      responses:
        '200': { description: Synthetic preview, content: { application/json: { schema: { $ref: '#/components/schemas/DemoProfilePreview' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: loadDemoPersona
      tags: [Demo]
      summary: "โหลดผู้ใช้ตัวอย่าง (โปรไฟล์ ข้อมูลสถานการณ์ งาน ความยินยอม) ให้เครื่องนี้ สำหรับ AC-01"
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/DemoPrefillSources' }
        - name: keepPlans
          in: query
          description: "เก็บแผนและความคืบหน้าเดิมเมื่อสลับชุดแหล่งข้อมูลใน gov-prefill หรือเคส D-MyTax"
          schema: { type: boolean, default: false }
      responses:
        '200': { description: Loaded, content: { application/json: { schema: { $ref: '#/components/schemas/DemoResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  parameters:
    DeviceId: { name: X-Device-Id, in: header, required: true, schema: { type: string, minLength: 8 }, description: "Anonymous per-install id. No login in the Demo." }
    ApiKey: { name: X-Api-Key, in: header, required: true, schema: { type: string }, description: "Key for integration partners. From environment, never in the repo." }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string }, description: "Same key within 24 h returns the first result instead of applying twice." }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 30, minimum: 1, maximum: 100 } }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: "Opaque. Use nextCursor from the previous page." }
    DemoPrefillSources:
      name: sources
      in: query
      description: "สำหรับ gov-prefill ระบุ thaid,tangRat,socialSecurity,dMyTax คั่นด้วยจุลภาค เว้นค่าเป็นค่าว่างเมื่อไม่เชื่อมสักแหล่ง ละพารามิเตอร์เพื่อใช้ทั้ง 4 แหล่ง"
      schema: { type: string }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Health:
      type: object
      required: [status, version, commit, startedAt, ai, features]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        commit: { type: string, description: "Source revision the server runs. Attach to test evidence (AC-05)." }
        startedAt: { type: string, format: date-time }
        ai: { type: object, properties: { provider: { type: string }, agent: { type: string } } }
        features: { type: object, properties: { govConnected: { type: boolean }, demo: { type: boolean } } }
        sources: { type: array, items: { type: object, properties: { provider: { type: string }, state: { type: string } } } }
        store: { type: string, enum: [memory, file], description: "memory = lost on restart" }
        storeLayout: { type: integer, description: "2 = device data split into collections identity / profile / activity / runtime (docs/design/data-storage.md)" }
        retention: { type: object, properties: { days: { type: number, description: "0 = off" }, mode: { type: string, enum: [archive, delete] } } }
        notifier: { type: string, enum: [mock], description: "mock = reminders are logged, not pushed to the phone" }
        aiDailyLimit: { type: integer, description: "AI calls per device per day before rules are used. 0 = no limit" }
        jobs: { type: array, items: { type: object, required: [name, enabled], properties: { name: { type: string }, everyMinutes: { type: number }, enabled: { type: boolean }, lastRunAt: { type: string, format: date-time }, lastResult: { type: string } } } }

    AppConfig:
      type: object
      description: "Full structure in contracts/app-config.schema.json (JSON Schema 2020-12)"
      required: [schemaVersion, configVersion, minAppVersion, tabs, routes, actions, filters]
      additionalProperties: true
      properties:
        schemaVersion: { type: integer }
        configVersion: { type: string }
        minAppVersion: { type: string }
        noticeVersion: { type: string, description: "Ask for consent again when the stored consent has another version" }
        mode: { type: string, enum: [demo, user], description: "Server mode" }
        governmentConnections:
          type: object
          description: "Live provider availability in user mode"
          required: [thaid, tangRat]
          properties:
            thaid: { type: string, enum: [approval_required] }
            tangRat: { type: string, enum: [access_required] }
        featureFlags: { type: object, additionalProperties: { type: boolean } }
        tabs: { type: array, items: { type: object } }
        routes: { type: object }
        actions: { type: object }
        filters: { type: array, items: { type: object } }

    Error:
      type: object
      required: [code, message, status, retryable, requestId]
      properties:
        code: { type: string, enum: [PROFILE_INCOMPLETE, NO_RESULTS, SOURCE_UNAVAILABLE, AI_UNAVAILABLE, STALE_DATA, NOT_FOUND, VALIDATION, MISSING_DEVICE, UNAUTHORIZED, CONFLICT, CONSENT_REQUIRED, FEATURE_DISABLED, INTERNAL] }
        message: { type: string, description: "Thai text safe to show the user" }
        status: { type: integer, description: "Same as the HTTP status" }
        retryable: { type: boolean }
        requestId: { type: string, description: "Same as the X-Request-Id header, for support" }
        missingFields: { type: array, items: { type: string }, description: "Missing fields, or the consent purpose that is needed" }

    AiStatus:
      type: string
      enum: [ok, fallback_rules, skipped_no_consent, unavailable, guarded]
      description: "fallback_rules = provider failed or not configured. skipped_no_consent = user did not consent to AI, rules were used. guarded = answered by the assistant policy without calling the AI (refusal, redirect, or a checklist answer)."

    PrivacyNotice:
      type: object
      required: [version, sections, purposes]
      properties:
        version: { type: string }
        note: { type: string }
        sections: { type: array, items: { type: object, required: [title, text], properties: { title: { type: string }, text: { type: string } } } }
        purposes: { type: array, items: { $ref: '#/components/schemas/Purpose' } }

    Purpose:
      type: object
      required: [id, required, title, description]
      properties:
        id: { type: string, enum: [core, location, ai, reminders, gov] }
        required: { type: boolean }
        title: { type: string }
        description: { type: string }

    ConsentRequest:
      type: object
      required: [noticeVersion, ageConfirmed, purposes]
      properties:
        noticeVersion: { type: string }
        ageConfirmed: { type: boolean, description: "20 or older, or a guardian consented" }
        purposes: { type: object, additionalProperties: { type: boolean } }

    Consent:
      type: object
      required: [id, noticeVersion, ageConfirmed, purposes, at]
      properties:
        id: { type: string }
        noticeVersion: { type: string }
        ageConfirmed: { type: boolean }
        purposes: { type: object, additionalProperties: { type: boolean } }
        at: { type: string, format: date-time }

    ConsentState:
      type: object
      required: [noticeVersion, needsRenewal, items]
      properties:
        current: { $ref: '#/components/schemas/Consent' }
        noticeVersion: { type: string }
        needsRenewal: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/Consent' } }

    Facts:
      type: object
      description: "Answers used by the eligibility rules. Definitions in /v1/taxonomies facts."
      properties:
        ageBand: { type: string, nullable: true }
        nationality: { type: boolean, nullable: true }
        registryDistrict: { type: string, nullable: true }
        registryProvince: { type: string, nullable: true }
        disabilityGets: { type: boolean, nullable: true }
        ageAtLeast55: { type: boolean, nullable: true }
        coverageEnded: { type: boolean, nullable: true }
        lifetimePaidMonths33And39: { type: number, nullable: true }
        govPension: { type: boolean, nullable: true }
        work: { type: string, nullable: true }
        ss33: { type: boolean, nullable: true }
        taxWithheld: { type: boolean, nullable: true }
        unpaidDays: { type: number, nullable: true }
        dailyWage: { type: number, nullable: true }
        wage: { type: number, nullable: true }
        oldAgeGets: { type: boolean, nullable: true }
        kidUnder6: { type: boolean, nullable: true }
        lowIncome: { type: boolean, nullable: true }
        disabilityCard: { type: boolean, nullable: true }
        welfareCard: { type: boolean, nullable: true }
        hasUnpaid: { type: boolean, nullable: true, description: "0.8: asked before unpaidDays so people without unpaid wages are not asked for a number" }

    MemoryItem:
      type: object
      required: [id, text, source, at]
      properties:
        id: { type: string }
        text: { type: string }
        source: { type: string, enum: [ai, user] }
        at: { type: string, format: date-time }

    MemoryList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/MemoryItem' } } }

    GovLink:
      type: object
      required: [status, provider, mock]
      properties:
        status: { type: string, enum: [not_connected, pending, connected] }
        provider: { type: string }
        mock: { type: boolean, description: "true until a real adapter exists. The app must show DEMO / MOCK." }
        authUrl: { type: string, format: uri }
        state: { type: string }
        connectedAt: { type: string, format: date-time }
        identity: { $ref: '#/components/schemas/GovIdentity' }

    GovIdentity:
      type: object
      description: "ข้อมูลตัวตนที่ได้จาก ThaID เมื่อเชื่อมแล้ว ชื่อ claim ตาม ThaID (OAuth2/OIDC ของกรมการปกครอง) ยังไม่ได้ยืนยันกับเอกสาร DOPA (claimsVerified=false). ThaID ไม่ให้ข้อมูลสิทธิ์หรือเงิน. เลขบัตรจริงไม่ออกจาก adapter: ได้แค่ pidMasked และ pidHash"
      required: [dataStatus, claimsVerified, scopes, pidMasked, claims, derived]
      properties:
        dataStatus: { type: string, enum: [mock, live], description: "mock = ข้อมูลสังเคราะห์ ต้องแสดง DEMO / MOCK" }
        claimsVerified: { type: boolean }
        scopes: { type: array, items: { type: string } }
        pidMasked: { type: string, example: "X-XXXX-XXXXX-12-3" }
        pidHash: { type: string, description: "hash ทางเดียว ใช้จับคู่ข้ามระบบภายหลัง ย้อนเป็นเลขบัตรไม่ได้" }
        claims:
          type: object
          properties:
            title: { type: string }
            given_name: { type: string }
            middle_name: { type: string }
            family_name: { type: string }
            name: { type: string }
            title_en: { type: string }
            given_name_en: { type: string }
            middle_name_en: { type: string }
            family_name_en: { type: string }
            name_en: { type: string }
            birthdate: { type: string, format: date }
            gender: { type: string }
            address: { type: object, properties: { formatted: { type: string }, street_address: { type: string }, locality: { type: string }, region: { type: string }, postal_code: { type: string }, country: { type: string } } }
            date_of_issuance: { type: string, format: date }
            date_of_expiry: { type: string, format: date }
            ial: { type: string, description: "Identity assurance level" }
        derived:
          type: object
          description: "ค่าที่ server คิดจาก claims เพื่อใช้กับโปรไฟล์และกฎเงิน"
          properties: { age: { type: integer }, ageBand: { type: string }, district: { type: string }, displayName: { type: string } }
        applied: { type: array, items: { type: string, enum: [displayName, district, ageBand] }, description: "ช่องที่ ThaID เติมให้ (ยกเลิกการเชื่อมแล้วคืนค่าเดิม)" }

    MoneyAmount:
      type: object
      required: [basis, note]
      properties:
        basis: { type: string, enum: [verified, rate, calc, none], description: "verified = government adapter, rate = published rate, calc = from user input, none = unknown" }
        value: { type: number }
        unit: { type: string }
        note: { type: string }

    MoneyQuestion:
      type: object
      required: [fact, question, type]
      properties:
        fact: { type: string }
        question: { type: string }
        type: { type: string, enum: [enum, bool, number, text] }
        help: { type: string, description: "0.8: plain explanation shown when the person does not understand the question" }
        options: { type: array, items: { type: string } }

    MoneyItem:
      type: object
      required: [id, title, kind, payer, status, amount, reasons, rulesVersion, dataStatus]
      properties:
        id: { type: string }
        title: { type: string }
        icon: { type: string }
        kind: { type: string, enum: [monthly, once] }
        payer: { type: string }
        status: { type: string, enum: [verified, likely, check, need, unlikely] }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        reasons: { type: array, items: { type: object, required: [text], properties: { ok: { type: boolean, nullable: true }, text: { type: string } } } }
        nextQuestion: { $ref: '#/components/schemas/MoneyQuestion' }
        rulesVersion: { type: string, description: "Date the criteria and rates were last checked against the sources (YYYY-MM-DD)" }
        alreadyReceiving: { type: boolean, description: "The person said they already get this. Status is check (verify the amount); never counted as new money." }
        dataStatus: { type: string, enum: [live, curated, mock], description: "live = government adapter, curated = rules from the listed public sources applied to self-reported answers, mock = demo government data" }

    MoneyOverview:
      type: object
      required: [summary, items, govLink]
      properties:
        summary:
          type: object
          required: [monthly, once, allVerified, counted, pending]
          properties:
            monthly: { type: number }
            once: { type: number }
            allVerified: { type: boolean }
            counted: { type: integer }
            pending: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/MoneyItem' } }
        govLink: { type: string, enum: [disabled, not_connected, pending, connected] }

    MoneyPreview:
      type: object
      required: [summary, items, stored]
      properties:
        summary:
          type: object
          required: [monthly, once, allVerified, counted, pending]
          properties:
            monthly: { type: number }
            once: { type: number }
            allVerified: { type: boolean }
            counted: { type: integer }
            pending: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/MoneyItem' } }
        nextQuestion: { $ref: '#/components/schemas/ChecklistStep' }
        stored: { type: boolean, enum: [false] }

    MoneyRoute:
      allOf:
        - { $ref: '#/components/schemas/MoneyItem' }
        - type: object
          required: [documents, channels, after, ifNo, claimable, sources, sourceNote]
          properties:
            sources:
              type: array
              description: "Where the criteria, rates, documents and channels came from"
              items: { type: object, required: [title, url, checkedAt], properties: { title: { type: string }, url: { type: string, format: uri }, checkedAt: { type: string, format: date } } }
            documents: { type: array, items: { type: object, required: [index, text, ready], properties: { index: { type: integer }, text: { type: string }, ready: { type: boolean } } } }
            channels: { type: array, items: { $ref: '#/components/schemas/Channel' } }
            contactGuide: { type: string, pattern: '^/docs/sources/', description: "Path to the relevant section of the project's contact report" }
            after: { type: string }
            ifNo: { type: string }
            letterTemplate: { type: string }
            claimable: { type: boolean }
            sourceNote: { type: string }

    Channel:
      type: object
      required: [kind, title, detail]
      properties:
        icon: { type: string }
        kind: { type: string, enum: [online, office, phone, letter] }
        title: { type: string }
        detail: { type: string }
        url: { type: string, format: uri }

    DataStatus: { type: string, enum: [live, curated, open_data, mock, blocked] }

    Money:
      type: object
      required: [basis]
      properties:
        basis: { type: string, enum: [official, listing, none], description: "Where the number came from. AI never fills this." }
        min: { type: number }
        max: { type: number }
        unit: { type: string, description: "for example บาท/วัน" }
        knownText: { type: string, description: "What is known when basis is none" }

    Location:
      type: object
      required: [precision]
      properties:
        precision: { type: string, enum: [exact, city, none] }
        isRemote: { type: boolean, description: "True when the provider explicitly lists the opportunity as remote." }
        workMode: { type: string, enum: [onsite, hybrid, remote] }
        province: { type: string }
        district: { type: string }
        districtCode: { type: string }
        districtName: { type: string }
        areaType: { type: string }
        address: { type: string }
        travelInfo: { type: string }
        coordinateSource: { type: string, enum: [database], readOnly: true, description: "Set by the database adapter for exact, non-mock coordinates." }
        text: { type: string }
        lat: { type: number }
        lng: { type: number }
        distanceKm: { type: number, description: "From the search point. Set by search." }

    PlanContact:
      type: object
      required: [label]
      properties:
        purpose: { type: string, description: "For example apply, submit, ask_before_visit or follow_up." }
        type: { type: string, description: "For example website, phone, email, map or office." }
        label: { type: string }
        destination: { type: string }
        hoursText: { type: string }
        instructions: { type: string }
        districtCode: { type: string }
        sourceUrl: { type: string }
        checkedAt: { type: string }

    PlanContacts:
      type: array
      items:
        oneOf:
          - { type: string }
          - { $ref: '#/components/schemas/PlanContact' }

    Provenance:
      type: object
      required: [provider, dataStatus, sourceUrl, fetchedAt, attribution]
      properties:
        provider: { type: string }
        dataStatus: { $ref: '#/components/schemas/DataStatus' }
        sourceUrl: { type: string, format: uri }
        sourceLinks:
          type: array
          description: "Provider links retained when the search result represents the same listing from multiple sources."
          items:
            type: object
            required: [provider, sourceUrl]
            properties:
              provider: { type: string }
              sourceUrl: { type: string, format: uri }
        postedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        fetchedAt: { type: string, format: date-time }
        ageDays: { type: integer }
        attribution: { type: string }
        linkStatus: { type: string, enum: [ok, broken, unknown], description: "Daily link check. broken (404/410) items are left out of search." }
        linkCheckedAt: { type: string, format: date-time }

    Opportunity:
      type: object
      required: [id, title, category, mapGroup, location, money, provenance, suspicious]
      properties:
        id: { type: string }
        title: { type: string }
        organization: { type: string }
        category: { type: string, description: "One of the 10 requirement categories" }
        mapGroup: { type: string }
        location: { $ref: '#/components/schemas/Location' }
        locations: { type: array, items: { $ref: '#/components/schemas/Location' } }
        description: { type: string }
        contacts: { $ref: '#/components/schemas/PlanContacts' }
        status: { type: string, enum: [active, closed, expired] }
        summary: { type: string }
        availability: { type: string, enum: [open, upcoming, paused, closed, expired] }
        checkedAt: { type: string }
        documents: { type: array, items: { type: string } }
        claim: { type: object }
        job: { type: object }
        income: { type: object }
        grant: { type: object }
        money: { $ref: '#/components/schemas/Money' }
        conditions: { type: array, items: { type: string } }
        provenance: { $ref: '#/components/schemas/Provenance' }
        suspicious: { type: boolean }
        suspiciousReasons: { type: array, items: { type: string } }
        checklistTemplateId: { type: string }
        skills: { type: array, items: { type: string }, description: "0.10: skills the listing asks for (used to rank by my skills and in the income plan)" }
        forOlder: { type: boolean, description: "0.10: the listing accepts older workers" }

    OpportunityInput:
      type: object
      description: "What an integration partner sends. The server computes suspicious flags, distance and age."
      required: [externalId, title, category, mapGroup, money, sourceUrl]
      properties:
        externalId: { type: string }
        title: { type: string }
        organization: { type: string }
        category: { type: string }
        mapGroup: { type: string }
        location: { $ref: '#/components/schemas/Location' }
        locations: { type: array, items: { $ref: '#/components/schemas/Location' } }
        description: { type: string }
        contacts: { $ref: '#/components/schemas/PlanContacts' }
        summary: { type: string }
        availability: { type: string, enum: [open, upcoming, paused, closed, expired] }
        checkedAt: { type: string }
        documents: { type: array, items: { type: string } }
        claim: { type: object }
        job: { type: object }
        income: { type: object }
        grant: { type: object }
        money: { $ref: '#/components/schemas/Money' }
        conditions: { type: array, items: { type: string } }
        sourceUrl: { type: string, format: uri }
        skills: { type: array, items: { type: string } }
        forOlder: { type: boolean }
        postedAt: { type: string, format: date-time }
        status: { type: string, enum: [active, closed], description: "Optional explicit posting status for a SQLite push source." }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    OpportunityBatch:
      type: object
      required: [provider, items]
      properties:
        provider: { type: string }
        dataStatus: { type: string, enum: [live, curated, open_data, mock], description: "If sent for a SQLite source, it must match its registered data status." }
        attribution: { type: string }
        items: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/OpportunityInput' } }

    BatchResult:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer }
        rejected: { type: array, items: { type: object, required: [index, reason], properties: { index: { type: integer }, reason: { type: string } } } }
        merged: { type: array, description: "Rows that match an existing listing from another source. SQLite retains both source records and groups matching posting URLs in search.", items: { type: object, required: [index, existingId], properties: { index: { type: integer }, existingId: { type: string } } } }

    WebhookEvent:
      type: object
      required: [event, externalId]
      properties:
        event: { type: string, enum: [opportunity.closed, opportunity.updated] }
        externalId: { type: string }
        data: { $ref: '#/components/schemas/OpportunityInput' }

    Suggestion:
      type: object
      required: [type, label]
      properties:
        type: { type: string, enum: [expand_radius, clear_query, all_groups, include_unknown_money] }
        label: { type: string }
        radiusKm: { type: number }

    OpportunityPage:
      type: object
      required: [items, hiddenSuspicious]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Opportunity' } }
        nextCursor: { type: string }
        totalCount: { type: integer, minimum: 0, description: "Matching visible items across all pages." }
        hasMoreMapLocations: { type: boolean, description: "Whether a later result has database coordinates available for the map." }
        hiddenSuspicious: { type: integer }
        districtPins:
          type: array
          description: "Approximate district markers for Bangkok demo opportunities that match the search, before pagination. Omitted unless requested."
          items:
            type: object
            required: [district, lat, lng, count]
            properties:
              district: { type: string }
              lat: { type: number, minimum: -90, maximum: 90 }
              lng: { type: number, minimum: -180, maximum: 180 }
              count: { type: integer, minimum: 1 }
        suggestions: { type: array, items: { $ref: '#/components/schemas/Suggestion' }, description: "Only when there are no results (FR-08)" }
        sourceWarnings: { type: array, items: { type: string }, description: "Providers whose last fetch failed. Details in /v1/sources." }

    RankingRequest:
      type: object
      required: [opportunityIds]
      properties:
        opportunityIds: { type: array, items: { type: string }, minItems: 1, maxItems: 50 }

    RankingResponse:
      type: object
      required: [aiStatus, ranked]
      properties:
        aiStatus: { $ref: '#/components/schemas/AiStatus' }
        aiInvocationId: { type: string, description: "Evidence that the AI step ran (AC-02)" }
        ranked:
          type: array
          items:
            type: object
            required: [opportunityId, fit, reason]
            properties:
              opportunityId: { type: string, description: "Always one of the requested ids" }
              fit: { type: string, enum: [high, good, fair] }
              reason: { type: string, description: "No money figures" }
              missingInfo: { type: array, items: { type: string } }

    ExplanationRequest:
      type: object
      required: [subjectType, subjectId]
      properties:
        subjectType: { type: string, enum: [task_step, opportunity, money] }
        subjectId: { type: string }

    Explanation:
      type: object
      required: [aiStatus, text]
      properties:
        aiStatus: { $ref: '#/components/schemas/AiStatus' }
        aiInvocationId: { type: string }
        text: { type: string }

    Conversation:
      type: object
      required: [conversationId, greeting]
      properties:
        conversationId: { type: string }
        greeting: { type: string }
        quickReplies: { type: array, items: { type: string } }
        step: { $ref: '#/components/schemas/ChecklistStep' }

    ChecklistStep:
      description: "The currently displayed question. Its identifier changes when the applicable question changes."
      allOf:
        - { $ref: '#/components/schemas/MoneyQuestion' }
        - type: object
          properties:
            id: { type: string }
            moneyId: { type: string }

    IncomeGoalPart:
      type: object
      required: [kind, id, title, net, numberSource, dataStatus, why]
      properties:
        kind: { type: string, enum: [benefit, job, skill] }
        id: { type: string }
        title: { type: string }
        net: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: "บาท/เดือน [ต่ำ, สูง] หลังหักค่าใช้จ่ายโดยประมาณ" }
        numberSource: { type: string, enum: [official, listing, estimate, none] }
        dataStatus: { $ref: '#/components/schemas/DataStatus' }
        matched: { type: array, items: { type: string }, description: "ทักษะของผู้ใช้ที่ตรงกับทางนี้" }
        assumptions: { type: array, items: { type: string } }
        why: { type: string }
        action: { type: object, properties: { type: { type: string, enum: [money_route, opportunity, idea] }, id: { type: string } } }
    IncomeGoalPlan:
      type: object
      required: [target, parts, total, gap, reach, missing, note]
      properties:
        target: { type: integer }
        parts: { type: array, items: { $ref: '#/components/schemas/IncomeGoalPart' } }
        total: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        gap: { type: number, description: "เป้า ลบ ยอดต่ำสุดของแผน (0 ถ้าถึง)" }
        reach: { type: string, enum: [likely, maybe, short], description: "likely = ยอดต่ำสุดถึงเป้า, maybe = ยอดสูงสุดถึงเป้า, short = ยังไม่ถึง" }
        missing: { type: array, items: { type: object, required: [id, text], properties: { id: { type: string, enum: [money_check, skills, hours] }, text: { type: string } } } }
        hoursPerWeek: { type: number }
        note: { type: string }
    GuardResult:
      type: object
      required: [kind, policyVersion]
      description: "How the Guard handled the message. Skipped questions remain unanswered for the current topic. Unclear messages can show a clarification question."
      properties:
        kind: { type: string, enum: [answer, skip, explain, in_scope, ai_scope, injection, sensitive, guarantee, scam, off_topic, unclear] }
        policyVersion: { type: string }

    AgentTurn:
      type: object
      required: [aiStatus, reply, toolCalls, pendingActions, memoryAdded]
      properties:
        aiStatus: { $ref: '#/components/schemas/AiStatus' }
        aiInvocationId: { type: string }
        reply: { type: string, description: "Money figures not found in tool results are removed" }
        toolCalls: { type: array, items: { type: object, required: [tool], properties: { tool: { type: string } } }, description: "Read tools the agent used, for transparency" }
        pendingActions: { type: array, items: { $ref: '#/components/schemas/PendingAction' } }
        planLinks:
          type: array
          description: "แผนรับเงินที่บันทึกในโปรไฟล์ของแชต และผู้ใช้ยังไม่ได้แจ้งว่าได้รับเงิน"
          items:
            type: object
            required: [taskId, title]
            properties:
              taskId: { type: string }
              title: { type: string }
        memoryAdded: { type: array, items: { $ref: '#/components/schemas/MemoryItem' } }
        quickReplies: { type: array, items: { type: string } }
        guard: { $ref: '#/components/schemas/GuardResult' }
        step: { $ref: '#/components/schemas/ChecklistStep' }

    PendingAction:
      type: object
      required: [id, tool, label]
      properties:
        id: { type: string }
        tool: { type: string, enum: [create_task, snooze_task, complete_step, update_facts, save_income_goal] }
        label: { type: string, description: "What will happen, in Thai, shown on the confirm button" }

    ActionResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [done, rejected] }
        result: { type: object, additionalProperties: true }

    PlanOption:
      type: object
      required: [id, title, track, payDays, effort, risk, numberSource]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        title: { type: string }
        track: { type: string, enum: [A, B, C] }
        grossPerMonth: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        costPerMonth: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        netPerMonth: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: "Deterministic: gross minus cost" }
        unknownReason: { type: string }
        payDays: { type: integer }
        effort: { type: integer, minimum: 1, maximum: 3 }
        risk: { type: string }
        numberSource: { type: string, enum: [official, listing, estimate, none] }
        assumptions: { type: array, items: { type: string } }
        matchedSkills: { type: array, items: { type: string } }

    PlanOptionList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/PlanOption' } } }

    IdeaList:
      type: object
      required: [aiStatus, items]
      properties:
        aiStatus: { $ref: '#/components/schemas/AiStatus' }
        items: { type: array, items: { $ref: '#/components/schemas/PlanOption' } }

    TaskStatus: { type: string, enum: [active, blocked, snoozed, finished] }

    TaskCreate:
      type: object
      description: "Exactly one of opportunityId or moneyId"
      properties:
        opportunityId: { type: string }
        moneyId: { type: string }
        districtCode: { type: string, pattern: '^[0-9]{4}$', description: "Optional area context, independent of the saved item identity." }

    Outcome:
      type: object
      required: [result, reportedBy, at]
      properties:
        result: { type: string, enum: [received, not_received, rejected, other] }
        amountReported: { type: number, description: "What the user says they received. Never shown as verified." }
        reportedBy: { type: string, enum: [user] }
        at: { type: string, format: date-time }

    Task:
      type: object
      required: [id, title, steps, doneCount, status, reportedBy]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        moneyId: { type: string }
        districtCode: { type: string, pattern: '^[0-9]{4}$' }
        title: { type: string }
        steps: { type: array, items: { type: string } }
        doneCount: { type: integer }
        status: { $ref: '#/components/schemas/TaskStatus' }
        reportedBy: { type: string, enum: [user, external], description: "Always user in the Demo (FR-06)" }
        dueText: { type: string }
        blockReason: { type: string }
        outcome: { $ref: '#/components/schemas/Outcome' }

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Task'
              - type: object
                properties:
                  category: { type: string, description: "Category from the existing catalogue, if the saved opportunity is still available in it" }

    TaskEventRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [complete_step, undo, block, snooze, resume, report_outcome] }
        reason: { type: string, enum: [not_understood, missing_documents, site_broken, other], description: "For block" }
        until: { type: string, enum: [tomorrow, in_3_days, next_week, never], description: "For snooze" }
        result: { type: string, enum: [received, not_received, rejected, other], description: "For report_outcome" }
        amountReported: { type: number, description: "For report_outcome" }

    TaskEvent:
      type: object
      required: [id, type, at]
      properties:
        id: { type: string }
        type: { type: string }
        at: { type: string, format: date-time }
        undone: { type: boolean }

    TaskEventList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/TaskEvent' } } }

    Profile:
      type: object
      properties:
        displayName: { type: string }
        district: { type: string }
        lat: { type: number }
        lng: { type: number }
        skills: { type: array, items: { type: string } }
        hoursPerWeek: { type: string }
        incomeGoalPerMonth: { type: number }
        goals: { type: array, items: { type: string } }
        constraints: { type: string }
        fromGov: { type: array, items: { type: string }, description: "อ่านอย่างเดียว: ช่องที่ ThaID เติมให้ (มีเมื่อเชื่อม ThaID แล้ว)" }
        dataStatus: { type: string, enum: [mock] }
        factProvenance:
          type: object
          additionalProperties:
            type: object
            required: [source, value]
            properties:
              source: { type: string, enum: [user, demo_answers, thaid, tangRat, socialSecurity, dMyTax] }
              value: { oneOf: [{ type: string }, { type: boolean }, { type: number }] }
              checkedAt: { type: string }
              taxYear: { type: integer }
              confirmed: { type: boolean }
              dataStatus: { type: string, enum: [mock] }
              status: { type: string, enum: [conflict, stale] }

    Settings:
      type: object
      properties:
        largeText: { type: boolean }

    MyData:
      type: object
      required: [profile, facts, settings, tasks, consents, memory, govLink, storedFields]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        facts: { $ref: '#/components/schemas/Facts' }
        settings: { $ref: '#/components/schemas/Settings' }
        tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
        consents: { type: array, items: { $ref: '#/components/schemas/Consent' } }
        memory: { type: array, items: { $ref: '#/components/schemas/MemoryItem' } }
        govLink: { type: object, properties: { status: { type: string }, provider: { type: string }, connectedAt: { type: string }, identity: { $ref: '#/components/schemas/GovIdentity' } } }
        storedFields: { type: array, items: { type: string } }
        notStored: { type: array, items: { type: string } }

    IntakeTurn:
      type: object
      required: [sessionId, aiStatus, done, profileDraft]
      properties:
        sessionId: { type: string }
        aiStatus: { $ref: '#/components/schemas/AiStatus' }
        question: { type: string }
        quickReplies: { type: array, items: { type: string } }
        profileDraft: { $ref: '#/components/schemas/Profile' }
        done: { type: boolean }

    Source:
      type: object
      required: [provider, name, kind, direction, state]
      properties:
        provider: { type: string }
        name: { type: string }
        kind: { type: string }
        direction: { type: string, enum: [pull, push, static], description: "pull = we fetch, push = partner sends via Integrations" }
        attribution: { type: string }
        state: { type: string, enum: [ok, failed, loading, static, idle] }
        itemCount: { type: integer }
        websiteUrl: { type: string, format: uri }
        accessMode: { type: string, enum: [link, pending, discovery], description: "How a surveyed source is available before its job feed is connected." }
        lastFetchedAt: { type: string, format: date-time }
        error: { type: string }

    SourceList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Source' } } }

    DemoResult:
      type: object
      required: [persona, label, profile, facts, taskCount, dataStatus]
      properties:
        persona: { type: string }
        label: { type: string }
        profile: { $ref: '#/components/schemas/Profile' }
        facts: { $ref: '#/components/schemas/Facts' }
        taskCount: { type: integer }
        dataStatus: { type: string, enum: [mock] }
        identity: { $ref: '#/components/schemas/GovIdentity' }
        sources:
          type: array
          description: Display summaries of synthetic source records for the demo persona.
          items: { $ref: '#/components/schemas/DemoSourceSummary' }

    DemoSourceSummary:
      type: object
      required: [field, label, value]
      properties:
        field: { type: string, enum: [identity, disabilityCard, ss33, taxWithheld] }
        label: { type: string }
        value: { type: string }
        checkedAt: { type: string, format: date }
        preview:
          type: object
          description: Display values from the selected synthetic source for onboarding. An unavailable value is omitted.
          additionalProperties: { type: string }

    DemoProfilePreview:
      type: object
      required: [profile, sources, dataStatus]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        identity: { $ref: '#/components/schemas/GovIdentity' }
        sources: { type: array, items: { $ref: '#/components/schemas/DemoSourceSummary' } }
        dataStatus: { type: string, enum: [mock] }

    Taxonomies:
      type: object
      required: [categories, mapGroups, skillGroups, districts, facts]
      properties:
        categories: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, mapGroup: { type: string } } } }
        mapGroups: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, icon: { type: string }, color: { type: string } } } }
        skillGroups: { type: array, items: { type: object, properties: { name: { type: string }, skills: { type: array, items: { type: string } } } } }
        districts: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, lat: { type: number }, lng: { type: number } } } }
        facts: { type: object, additionalProperties: { type: object, properties: { question: { type: string }, type: { type: string }, options: { type: array, items: { type: string } } } } }
